<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1e40af"/>
    </linearGradient>
    <clipPath id="body">
      <rect x="9" y="11" width="14" height="16" rx="2.5"/>
    </clipPath>
  </defs>

  <!-- Fond arrondi bleu -->
  <rect width="32" height="32" rx="8" fill="url(#bg)"/>

  <!-- Capuchon shaker -->
  <rect x="12" y="4" width="8" height="5" rx="2" fill="white" opacity="0.92"/>

  <!-- Transition capuchon → corps -->
  <rect x="10" y="8.5" width="12" height="3" rx="1" fill="white" opacity="0.6"/>

  <!-- Corps shaker -->
  <rect x="9" y="11" width="14" height="16" rx="2.5" fill="white"/>

  <!-- Vague de liquide (protéine) -->
  <g clip-path="url(#body)">
    <path d="M9 21 Q12 18.2 16 21 Q20 23.8 23 21 L23 27 L9 27 Z"
          fill="#2563eb" opacity="0.5"/>
  </g>

  <!-- Repère de mesure -->
  <line x1="10.5" y1="17" x2="14" y2="17" stroke="#d1d5db" stroke-width="0.9" stroke-linecap="round"/>
</svg>
