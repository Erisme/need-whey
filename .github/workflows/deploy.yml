name: Deploy to Synology NAS

on:
  push:
    branches:
      - main

env:
  IMAGE: ghcr.io/erisme/need-whey-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Créer le répertoire sur le NAS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.NAS_PORT }}
          script: mkdir -p ${{ secrets.NAS_DIR }}

      - name: Copier docker-compose.yml sur le NAS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.NAS_PORT }}
          source: docker-compose.yml
          target: ${{ secrets.NAS_DIR }}
          strip_components: 0

      - name: Pull image & redémarrer le container
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.NAS_PORT }}
          script: |
            cd ${{ secrets.NAS_DIR }}
            docker pull ${{ env.IMAGE }}:latest
            docker compose up -d --remove-orphans
