name: Deploy to Synology NAS

on:
  push:
    branches:
      - main

env:
  IMAGE: ghcr.io/erisme/need-whey-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    env:
      NAS_DIR: ${{ vars.NAS_DIR }}
    steps:
      - uses: actions/checkout@v4

      - name: Créer le répertoire sur le NAS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.NAS_PORT }}
          script: mkdir -p "${{ vars.NAS_DIR }}"

      - name: Copier docker-compose.yml sur le NAS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.NAS_PORT }}
          source: docker-compose.yml
          target: ${{ secrets.NAS_DIR }}

      - name: Bootstrap + pull image + redémarrer
        uses: appleboy/ssh-action@v1
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.NAS_PORT }}
          envs: NAS_DIR,IMAGE,AUTH_SECRET
          script: |
            mkdir -p "$NAS_DIR"

            # Écrire le .env sur le NAS (AUTH_SECRET injecté depuis GitHub Secrets)
            echo "AUTH_SECRET=${AUTH_SECRET}" > "$NAS_DIR/.env"

            # Synology : docker n'est pas dans le PATH SSH standard
            DOCKER=$(command -v docker 2>/dev/null \
              || echo /var/packages/ContainerManager/target/usr/bin/docker)

            cd "$NAS_DIR"
            "$DOCKER" pull "$IMAGE:latest"

            # Compose v2 (plugin) ou v1 (binaire séparé)
            if "$DOCKER" compose version >/dev/null 2>&1; then
              "$DOCKER" compose up -d --remove-orphans
            else
              docker-compose up -d --remove-orphans
            fi
