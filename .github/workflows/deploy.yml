name: Deploy to Synology NAS

on:
  push:
    branches:
      - main

env:
  IMAGE: ghcr.io/erisme/need-whey-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Bootstrap + déploiement
        uses: appleboy/ssh-action@v1
        env:
          NAS_DIR: ${{ vars.NAS_DIR }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          IMAGE: ${{ env.IMAGE }}
        with:
          host: ${{ secrets.NAS_HOST }}
          username: ${{ secrets.NAS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.NAS_PORT }}
          envs: NAS_DIR,AUTH_SECRET,IMAGE
          script: |
            set -e
            mkdir -p "$NAS_DIR"

            DOCKER=$(command -v docker 2>/dev/null \
              || echo /var/packages/ContainerManager/target/usr/bin/docker)

            # Écrire docker-compose.yml directement (pas de SCP)
            cat > "$NAS_DIR/docker-compose.yml" << 'COMPOSE'
            services:
              app:
                image: ghcr.io/erisme/need-whey-app:latest
                container_name: need-whey
                ports:
                  - "8003:3000"
                environment:
                  DATABASE_URL: "file:/app/data/prod.db"
                  AUTH_SECRET: "${AUTH_SECRET}"
                volumes:
                  - need-whey-db:/app/data
                restart: unless-stopped
                healthcheck:
                  test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
                  interval: 30s
                  timeout: 10s
                  retries: 3

            volumes:
              need-whey-db:
                name: need-whey-db
            COMPOSE

            # Écrire le .env avec le secret
            echo "AUTH_SECRET=${AUTH_SECRET}" > "$NAS_DIR/.env"

            cd "$NAS_DIR"
            # Pull avec config Docker vide pour éviter tout credential caché
            DOCKER_CONFIG=$(mktemp -d)
            export DOCKER_CONFIG
            "$DOCKER" pull "$IMAGE:latest"
            unset DOCKER_CONFIG

            if "$DOCKER" compose version >/dev/null 2>&1; then
              "$DOCKER" compose up -d --remove-orphans
            else
              docker-compose up -d --remove-orphans
            fi
